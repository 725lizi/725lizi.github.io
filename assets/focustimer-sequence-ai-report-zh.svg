<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="880" viewBox="0 0 1020 880" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3d4c5c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1020" height="880" fill="#ffffff"/>
  <text x="510" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2d3d">时序图①  点一次「生成 AI 周报」，程序内部发生了什么（阶段 2）</text>
  <text x="510" y="56" text-anchor="middle" font-size="12.5" fill="#7a8794">实线=主动调用，虚线=返回/回退；核心思想：先把本地规则版算好攥在手里，再去请求大模型，任何意外都有兜底</text>

  <!-- lifelines -->
  <g stroke="#b9c4cf" stroke-width="1.3" stroke-dasharray="5,4">
    <line x1="90" y1="100" x2="90" y2="838"/>
    <line x1="258" y1="100" x2="258" y2="838"/>
    <line x1="426" y1="100" x2="426" y2="838"/>
    <line x1="594" y1="100" x2="594" y2="838"/>
    <line x1="762" y1="100" x2="762" y2="838"/>
    <line x1="930" y1="100" x2="930" y2="838"/>
  </g>
  <!-- actors -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="20" y="60" width="140" height="40" rx="8" fill="#E8F1FB" stroke="#3B7BBF"/><text x="90" y="78" fill="#235a8f">统计页 UI</text><text x="90" y="94" font-size="10.5" font-weight="400" fill="#5b7a97">Statistics</text>
    <rect x="188" y="60" width="140" height="40" rx="8" fill="#FFF4E0" stroke="#E09A2E"/><text x="258" y="78" fill="#a9701a">编排器</text><text x="258" y="94" font-size="10.5" font-weight="400" fill="#b08a3e">AiReportOrchestrator</text>
    <rect x="356" y="60" width="140" height="40" rx="8" fill="#E7F6F0" stroke="#2FA983"/><text x="426" y="78" fill="#1f7f61">规则引擎(本地)</text><text x="426" y="94" font-size="10.5" font-weight="400" fill="#4f9a82">LearningAnalysis</text>
    <rect x="524" y="60" width="140" height="40" rx="8" fill="#F1EEFB" stroke="#7C6BD8"/><text x="594" y="78" fill="#5446a8">决策/网络</text><text x="594" y="94" font-size="10.5" font-weight="400" fill="#7d70b8">Strategy·NetState</text>
    <rect x="692" y="60" width="140" height="40" rx="8" fill="#EEF3FB" stroke="#5B86C8"/><text x="762" y="78" fill="#2f5ea0">网络客户端</text><text x="762" y="94" font-size="10.5" font-weight="400" fill="#6b87b5">DeepSeekClient</text>
    <rect x="860" y="60" width="140" height="40" rx="8" fill="#EAF0F3" stroke="#5B7C8C"/><text x="930" y="78" fill="#3f5c6b">DeepSeek 云</text><text x="930" y="94" font-size="10.5" font-weight="400" fill="#6f8b99">大模型 API</text>
  </g>

  <!-- branch band: before decision normal calls -->
  <g font-size="12" fill="#2b3a4a">
    <line x1="90" y1="132" x2="252" y2="132" stroke="#3d4c5c" stroke-width="1.5" marker-end="url(#ar)"/>
    <text x="171" y="124" text-anchor="middle">① 点击「生成 AI 周报」</text>

    <line x1="258" y1="176" x2="420" y2="176" stroke="#3d4c5c" stroke-width="1.5" marker-end="url(#ar)"/>
    <text x="339" y="168" text-anchor="middle">② 先用本地专注数据算「规则版」</text>
    <line x1="420" y1="214" x2="264" y2="214" stroke="#6b7a89" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#ar)"/>
    <text x="342" y="206" text-anchor="middle" fill="#5a6b7b">返回规则版文本，先攥在手里（兜底）</text>

    <line x1="258" y1="258" x2="588" y2="258" stroke="#3d4c5c" stroke-width="1.5" marker-end="url(#ar)"/>
    <text x="423" y="250" text-anchor="middle">③ 三条件决策：开关开？有 Key？有网？</text>
    <line x1="588" y1="296" x2="264" y2="296" stroke="#6b7a89" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#ar)"/>
    <text x="426" y="288" text-anchor="middle" fill="#5a6b7b">shouldUseAi = true / false</text>
  </g>

  <!-- branch 1: not satisfied -->
  <rect x="36" y="312" width="948" height="56" rx="6" fill="#F4F6F8" stroke="#C4CDD5"/>
  <text x="48" y="331" font-size="11.5" font-weight="700" fill="#6b7785">分支① 三条件不满足</text>
  <g font-size="12">
    <line x1="252" y1="356" x2="96" y2="356" stroke="#6b7a89" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#ar)"/>
    <text x="300" y="350" text-anchor="middle" fill="#46586a">直接显示规则版，标签「规则周报」，不联网</text>
  </g>

  <!-- normal path to cloud -->
  <g font-size="12" fill="#2b3a4a">
    <line x1="258" y1="404" x2="756" y2="404" stroke="#3d4c5c" stroke-width="1.5" marker-end="url(#ar)"/>
    <text x="507" y="396" text-anchor="middle">④ 满足：ReportPromptBuilder 拼提示词，发起 SSE 流式请求</text>
    <line x1="762" y1="442" x2="924" y2="442" stroke="#3d4c5c" stroke-width="1.5" marker-end="url(#ar)"/>
    <text x="843" y="434" text-anchor="middle">POST /chat/completions (stream)</text>
    <line x1="924" y1="486" x2="768" y2="486" stroke="#6b7a89" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#ar)"/>
    <text x="846" y="478" text-anchor="middle" fill="#5a6b7b">⑤ 一块一块返回 data:（很多次）</text>
    <line x1="756" y1="528" x2="96" y2="528" stroke="#2f5ea0" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#ar)"/>
    <text x="426" y="520" text-anchor="middle" fill="#2f5ea0">SseChunkParser 拼好半包/坏 JSON，页面逐字蹦出（流式渲染）</text>
  </g>

  <!-- branch 2: error -->
  <rect x="36" y="548" width="948" height="120" rx="6" fill="#FDF1F0" stroke="#E0A39E"/>
  <text x="48" y="567" font-size="11.5" font-weight="700" fill="#b45046">分支②  请求出错（断网 / 错 Key / 超时 / 限流）</text>
  <g font-size="12">
    <line x1="924" y1="584" x2="768" y2="584" stroke="#b45046" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#ar)"/>
    <text x="846" y="578" text-anchor="middle" fill="#b45046">返回错误状态码 / 系统错误</text>
    <line x1="762" y1="618" x2="264" y2="618" stroke="#b45046" stroke-width="1.4" marker-end="url(#ar)"/>
    <text x="513" y="610" text-anchor="middle" fill="#b45046">HttpErrorMapper 把各种错误归一为 8 类</text>
    <line x1="252" y1="652" x2="96" y2="652" stroke="#E09A2E" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ar)"/>
    <text x="174" y="646" text-anchor="middle" fill="#a9701a">除「用户主动取消」外，一律回退第②步的规则版</text>
  </g>

  <!-- normal finish -->
  <rect x="36" y="688" width="948" height="120" rx="6" fill="#EEF8F3" stroke="#8FCBB2"/>
  <text x="48" y="707" font-size="11.5" font-weight="700" fill="#1f7f61">正常路径收尾</text>
  <g font-size="12">
    <line x1="924" y1="724" x2="768" y2="724" stroke="#1f7f61" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#ar)"/>
    <text x="846" y="718" text-anchor="middle" fill="#1f7f61">收到 [DONE]，流结束</text>
    <line x1="756" y1="758" x2="264" y2="758" stroke="#3d4c5c" stroke-width="1.4" marker-end="url(#ar)"/>
    <text x="510" y="750" text-anchor="middle">settled 标志保证只收尾一次（幂等），并销毁请求对象防泄漏</text>
    <line x1="252" y1="792" x2="96" y2="792" stroke="#1f7f61" stroke-width="1.5" marker-end="url(#ar)"/>
    <text x="174" y="786" text-anchor="middle" fill="#1f7f61">显示完整周报，标签「AI 周报」</text>
  </g>

  <text x="510" y="858" text-anchor="middle" font-size="12" fill="#7a8794">面试一句话：先本地兜底、再条件决策、流式渲染、出错归一化后优雅降级——保证任何情况下用户都拿得到一份周报。</text>
</svg>
