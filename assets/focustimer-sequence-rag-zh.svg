<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="800" viewBox="0 0 1020 800" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif">
  <defs>
    <marker id="ar2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3d4c5c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1020" height="800" fill="#ffffff"/>
  <text x="510" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2d3d">时序图②  在知识库提一个问题，RAG 内部怎么找到「你自己的笔记」来回答（阶段 3）</text>
  <text x="510" y="56" text-anchor="middle" font-size="12.5" fill="#7a8794">索引构建（切块→向量化→入库）见数据流图；本图只画「提问→作答」。实线=调用，虚线=返回</text>

  <g stroke="#b9c4cf" stroke-width="1.3" stroke-dasharray="5,4">
    <line x1="90" y1="100" x2="90" y2="720"/>
    <line x1="258" y1="100" x2="258" y2="720"/>
    <line x1="426" y1="100" x2="426" y2="720"/>
    <line x1="594" y1="100" x2="594" y2="720"/>
    <line x1="762" y1="100" x2="762" y2="720"/>
    <line x1="930" y1="100" x2="930" y2="720"/>
  </g>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="20" y="60" width="140" height="40" rx="8" fill="#E8F1FB" stroke="#3B7BBF"/><text x="90" y="78" fill="#235a8f">知识库页 UI</text><text x="90" y="94" font-size="10.5" font-weight="400" fill="#5b7a97">KnowledgeBase</text>
    <rect x="188" y="60" width="140" height="40" rx="8" fill="#FFF4E0" stroke="#E09A2E"/><text x="258" y="78" fill="#a9701a">问答门面</text><text x="258" y="94" font-size="10.5" font-weight="400" fill="#b08a3e">RagQaService</text>
    <rect x="356" y="60" width="140" height="40" rx="8" fill="#F1EEFB" stroke="#7C6BD8"/><text x="426" y="78" fill="#5446a8">规划/防幻觉</text><text x="426" y="94" font-size="10.5" font-weight="400" fill="#7d70b8">RagQaPlanner</text>
    <rect x="524" y="60" width="140" height="40" rx="8" fill="#E7F6F0" stroke="#2FA983"/><text x="594" y="78" fill="#1f7f61">向量化(联网)</text><text x="594" y="94" font-size="10.5" font-weight="400" fill="#4f9a82">Embedding·BGE</text>
    <rect x="692" y="60" width="140" height="40" rx="8" fill="#EAF0F3" stroke="#5B7C8C"/><text x="762" y="78" fill="#3f5c6b">本地向量库</text><text x="762" y="94" font-size="10.5" font-weight="400" fill="#6f8b99">VectorStore</text>
    <rect x="860" y="60" width="140" height="40" rx="8" fill="#EEF3FB" stroke="#5B86C8"/><text x="930" y="78" fill="#2f5ea0">大模型云</text><text x="930" y="94" font-size="10.5" font-weight="400" fill="#6b87b5">DeepSeek</text>
  </g>

  <g font-size="12" fill="#2b3a4a">
    <line x1="90" y1="132" x2="252" y2="132" stroke="#3d4c5c" stroke-width="1.5" marker-end="url(#ar2)"/>
    <text x="171" y="124" text-anchor="middle">① 输入问题、点发送（埋点记起点）</text>

    <line x1="258" y1="172" x2="420" y2="172" stroke="#3d4c5c" stroke-width="1.5" marker-end="url(#ar2)"/>
    <text x="339" y="164" text-anchor="middle">plan(问题)</text>

    <line x1="426" y1="212" x2="588" y2="212" stroke="#3d4c5c" stroke-width="1.5" marker-end="url(#ar2)"/>
    <text x="507" y="204" text-anchor="middle">② 问题加检索前缀，联网转成 1024 维向量</text>
    <line x1="588" y1="250" x2="432" y2="250" stroke="#6b7a89" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#ar2)"/>
    <text x="510" y="242" text-anchor="middle" fill="#5a6b7b">返回问题向量 query vector</text>

    <line x1="426" y1="294" x2="756" y2="294" stroke="#3d4c5c" stroke-width="1.5" marker-end="url(#ar2)"/>
    <text x="591" y="286" text-anchor="middle">③ 本地 Top-K=5 余弦相似度检索</text>
    <line x1="756" y1="332" x2="432" y2="332" stroke="#6b7a89" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#ar2)"/>
    <text x="594" y="324" text-anchor="middle" fill="#5a6b7b">返回最相似的 5 个笔记块 + 各自得分</text>
  </g>

  <!-- self loop threshold -->
  <path d="M426,356 h46 v22 h-40" fill="none" stroke="#7C6BD8" stroke-width="1.5" marker-end="url(#ar2)"/>
  <text x="482" y="370" font-size="12" fill="#5446a8">④ AnswerDecider：最高分 ≥ 0.2 吗？</text>

  <!-- branch no evidence -->
  <rect x="36" y="386" width="948" height="62" rx="6" fill="#F4F6F8" stroke="#C4CDD5"/>
  <text x="48" y="405" font-size="11.5" font-weight="700" fill="#6b7785">分支①  都低于 0.2（笔记里根本没相关内容）→ mode=no_evidence</text>
  <g font-size="12">
    <line x1="432" y1="432" x2="924" y2="432" stroke="#6b7a89" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#ar2)"/>
    <text x="678" y="424" text-anchor="middle" fill="#46586a">用「先声明材料不足、再给标注过的通用建议」提示词，不假装引用笔记</text>
  </g>

  <!-- branch grounded -->
  <rect x="36" y="462" width="948" height="120" rx="6" fill="#F3EFFB" stroke="#A99BE0"/>
  <text x="48" y="481" font-size="11.5" font-weight="700" fill="#5446a8">分支②  有≥0.2 的命中 → mode=grounded（真机本次 used=2，确实翻到 2 段本人笔记）</text>
  <g font-size="12">
    <path d="M426,492 h46 v20 h-40" fill="none" stroke="#7C6BD8" stroke-width="1.5" marker-end="url(#ar2)"/>
    <text x="482" y="506" fill="#5446a8">ContextBuilder：按 1200 字预算装材料、同篇多块合并成一条引用</text>
    <line x1="432" y1="540" x2="924" y2="540" stroke="#3d4c5c" stroke-width="1.6" marker-end="url(#ar2)"/>
    <text x="678" y="532" text-anchor="middle">⑤ QaPromptBuilder 下硬约束：「只能用给的材料、不足明说、逐句标[材料n]」→ 流式请求</text>
    <line x1="924" y1="568" x2="96" y2="568" stroke="#2f5ea0" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#ar2)"/>
    <text x="510" y="560" text-anchor="middle" fill="#2f5ea0">⑥ 逐字生成答案，结尾挂「来源：哪篇笔记」标签，可点回原文核对</text>
  </g>

  <!-- perf band -->
  <rect x="36" y="600" width="948" height="86" rx="6" fill="#FFF8EC" stroke="#E0B25C"/>
  <text x="48" y="621" font-size="12" font-weight="700" fill="#a9701a">真机实测（[RAG-Perf] 埋点，硅基流动 BGE + DeepSeek，1 篇笔记 2 块）</text>
  <g font-size="12" fill="#7a5818">
    <text x="48" y="645">· 问题向量化(联网)+本地检索+规划 plan ready = 464ms，其中本地余弦检索不到 1ms</text>
    <text x="48" y="667">· 点发送到第一个字 TTFT = 1327ms；整段 141 字生成完 total = 2105ms —— 等待主要在两次联网，不在本地</text>
  </g>

  <text x="510" y="716" text-anchor="middle" font-size="12" fill="#7a8794">面试一句话：先把问题变向量、在自己笔记里做相似度检索，再用阈值+预算+提示词三道闸防止模型瞎编，答案带来源可追溯。</text>
  <text x="510" y="740" text-anchor="middle" font-size="12" fill="#7a8794">这就是 RAG（检索增强生成）：不是让模型背知识，而是现场翻你自己的资料再作答。</text>
</svg>
